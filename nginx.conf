# Jobberman x Mastercard Foundation Mentorship Portal - Nginx Virtual Host Config
# Domain: mentorship.jobberman.com

server {
    listen 80;
    listen [::]:80;
    server_name mentorship.jobberman.com www.mentorship.jobberman.com;

    # Automatic HTTP to HTTPS Redirect
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mentorship.jobberman.com;

    root /var/www/mentorship-jobberman-portal/dist;
    index index.html;

    # SSL TLS Certificates Configuration (Let's Encrypt / Certbot or Custom CA)
    ssl_certificate /etc/letsencrypt/live/mentorship.jobberman.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mentorship.jobberman.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://api-mentorship.jobberman.com;" always;

    # Static Assets Long-Term Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA Routing Fallback (Direct all routes to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error Page
    error_page 404 /index.html;

    # Logs
    access_log /var/log/nginx/mentorship_jobberman_access.log;
    error_log /var/log/nginx/mentorship_jobberman_error.log;
}
